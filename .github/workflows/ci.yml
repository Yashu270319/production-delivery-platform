name: PDP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run API tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated test gate
        run: make test

  container-validation:
    name: Build and smoke-test container
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build container image
        run: docker build --tag pdp-api:ci --file docker/Dockerfile .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pdp-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM


      - name: Create CI network
        run: docker network create pdp-ci-net

      - name: Start dependency health server
        run: |
          docker run --detach \
            --name pdp-dependency-ci \
            --network pdp-ci-net \
            --volume "$PWD/dependency:/dependency:ro" \
            --workdir /dependency \
            python:3.12-slim \
            python health_server.py

      - name: Start API container
        run: |
          docker run --detach \
            --name pdp-api-ci \
            --network pdp-ci-net \
            --publish 8000:8000 \
            --env APP_VERSION=1.0.0 \
            --env DEPENDENCY_URL=http://pdp-dependency-ci:8081/health \
            pdp-api:ci

      - name: Verify health endpoint
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health/live; then
              echo
              echo "Liveness endpoint passed."
              break
            fi

            echo "Attempt ${attempt}/20: API not ready yet."
            sleep 2
          done

          if ! curl --fail --silent http://127.0.0.1:8000/health/live; then
            echo "Liveness endpoint failed. Container logs:"
            docker logs pdp-api-ci
            exit 1
          fi

      - name: Validate deployment
        run: ./scripts/validate-deployment.sh http://127.0.0.1:8000 1.0.0

      - name: Clean up containers and network
        if: always()
        run: |
          docker rm --force pdp-api-ci pdp-dependency-ci || true
          docker network rm pdp-ci-net || true
