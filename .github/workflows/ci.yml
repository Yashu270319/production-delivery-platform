name: PDP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run API tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated test gate
        run: make test

  container-validation:
    name: Build and smoke-test container
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build container image
        run: docker build --tag pdp-api:ci --file docker/Dockerfile .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pdp-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM

      - name: Start container
        run: docker run --detach --name pdp-api-ci --publish 8000:8000 pdp-api:ci

      - name: Verify health endpoint
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health/live; then
              echo
              echo "Health endpoint passed."
              exit 0
            fi

            echo "Attempt ${attempt}/20: API not ready yet."
            sleep 2
          done

          echo "Health endpoint did not become ready. Container logs:"
          docker logs pdp-api-ci
          exit 1

      - name: Clean up container
        if: always()
        run: docker rm --force pdp-api-ci || true
