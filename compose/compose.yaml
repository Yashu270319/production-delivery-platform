
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: pdp-api:1.0.0
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
